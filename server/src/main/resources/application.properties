server.port=${SERVER_PORT:9090}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/videotrace?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=3000
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
spring.mvc.async.request-timeout=${AI_INTERACTIVE_TIMEOUT_MS:180000}
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

# Upload
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# Model gateway
ai.deepseek.api-key=${SILICONFLOW_API_KEY}
ai.deepseek.base-url=${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
ai.deepseek.model=${LLM_MODEL:deepseek-ai/DeepSeek-V3.2}
ai.deepseek.timeout-seconds=${LLM_TIMEOUT_SECONDS:300}
ai.deepseek.input-price-per-million=${LLM_INPUT_PRICE_PER_MILLION:0}
ai.deepseek.output-price-per-million=${LLM_OUTPUT_PRICE_PER_MILLION:0}
ai.embedding.model=${EMBEDDING_MODEL:BAAI/bge-m3}
ai.asr.url=${ASR_URL:https://api.siliconflow.cn/v1/audio/transcriptions}
ai.asr.model=${ASR_MODEL:TeleAI/TeleSpeechASR}

# Agent termination budget
agent.budget.max-rounds=${AGENT_MAX_ROUNDS:2}
agent.budget.max-duration-ms=${AGENT_MAX_DURATION_MS:120000}
agent.budget.max-estimated-tokens=${AGENT_MAX_ESTIMATED_TOKENS:50000}
# 0 means disabled. When enabled, configure both provider prices above.
agent.budget.max-estimated-cost=${AGENT_MAX_ESTIMATED_COST:0}
agent.evaluation.enabled=${AGENT_EVALUATION_ENABLED:false}

# Vector store
vector.qdrant.enabled=${QDRANT_ENABLED:true}
vector.qdrant.url=${QDRANT_URL:http://localhost:6333}
vector.qdrant.api-key=${QDRANT_API_KEY:}
vector.qdrant.collection=${QDRANT_COLLECTION:video_chunks}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=3000ms

# MinIO
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET:media}
minio.public-read=${MINIO_PUBLIC_READ:false}

# Local media tools
tool.ytdlp.path=${YTDLP_PATH:yt-dlp}
# 部分站点（如 B 站）需要登录态 cookie 才能下载，否则返回 HTTP 412。
# 二者互斥，YTDLP_COOKIES（Netscape 格式文件）优先，更适合服务端无人值守场景。
tool.ytdlp.cookies=${YTDLP_COOKIES:}
tool.ytdlp.cookies-from-browser=${YTDLP_COOKIES_FROM_BROWSER:}
# Blank disables URL import. The proxy must enforce public-only egress for each request.
tool.ytdlp.proxy=${YTDLP_PROXY:}
tool.ffmpeg.dir=${FFMPEG_DIR:}
tool.ocr.command=${OCR_COMMAND:tesseract}

# RocketMQ
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer.group=${ROCKETMQ_PRODUCER_GROUP:video-analysis-producer}
rocketmq.producer.send-message-timeout=3000
rocketmq.topic.video-analysis=${ROCKETMQ_ANALYSIS_TOPIC:video-analysis-topic}
rocketmq.topic.video-analysis-dead=${ROCKETMQ_ANALYSIS_DEAD_TOPIC:video-analysis-dead-topic}
rocketmq.consumer.group=${ROCKETMQ_ANALYSIS_GROUP:video-analysis-consumer}

# Durable MQ handoff; OBSERVED is receipt, not completed analysis.
analysis.delivery.scan-ms=${ANALYSIS_DELIVERY_SCAN_MS:10000}
analysis.delivery.lease-seconds=${ANALYSIS_DELIVERY_LEASE_SECONDS:60}
analysis.delivery.ack-seconds=${ANALYSIS_DELIVERY_ACK_SECONDS:300}
analysis.delivery.batch-size=${ANALYSIS_DELIVERY_BATCH_SIZE:50}

analysis.execution.lease-seconds=${ANALYSIS_EXECUTION_LEASE_SECONDS:120}
analysis.execution.heartbeat-seconds=${ANALYSIS_EXECUTION_HEARTBEAT_SECONDS:30}
analysis.execution.scan-ms=${ANALYSIS_EXECUTION_SCAN_MS:10000}

# Bump when ASR/OCR model or extraction rules change; partitions stages and analysis caches.
video.parse.version=${VIDEO_PARSE_VERSION:v1}

# Worker resource budgets; size against the host and provider quotas.
analysis.pools.ai.core=${AI_POOL_CORE:2}
analysis.pools.ai.max=${AI_POOL_MAX:4}
analysis.pools.ai.queue=${AI_POOL_QUEUE:20}
analysis.pools.asr.core=${ASR_POOL_CORE:2}
analysis.pools.asr.max=${ASR_POOL_MAX:4}
analysis.pools.asr.queue=${ASR_POOL_QUEUE:8}
analysis.pools.ocr.core=${OCR_POOL_CORE:2}
analysis.pools.ocr.max=${OCR_POOL_MAX:2}
analysis.pools.ocr.queue=${OCR_POOL_QUEUE:4}
analysis.pools.llm.core=${LLM_POOL_CORE:2}
analysis.pools.llm.max=${LLM_POOL_MAX:4}
analysis.pools.llm.queue=${LLM_POOL_QUEUE:8}
analysis.consumer.min=${ANALYSIS_CONSUMER_MIN:2}
analysis.consumer.max=${ANALYSIS_CONSUMER_MAX:4}
analysis.media.concurrent=${MEDIA_PROCESS_CONCURRENT:2}
analysis.calls.asr.concurrent=${ASR_CALL_CONCURRENT:4}
analysis.calls.asr.per-minute=${ASR_CALLS_PER_MINUTE:60}
analysis.calls.llm.concurrent=${LLM_CALL_CONCURRENT:4}
analysis.calls.llm.per-minute=${LLM_CALLS_PER_MINUTE:30}
analysis.calls.embedding.concurrent=${EMBEDDING_CALL_CONCURRENT:4}
analysis.calls.embedding.per-minute=${EMBEDDING_CALLS_PER_MINUTE:120}

analysis.execution.defer-seconds=${ANALYSIS_DEFER_SECONDS:30}

creation.enabled=${CREATOR_ENABLED:true}
creation.url=${CREATOR_URL:http://127.0.0.1:8091}
creation.internal-token=${CREATOR_INTERNAL_TOKEN:}
creation.dispatch-delay-ms=${CREATOR_DISPATCH_DELAY_MS:5000}
